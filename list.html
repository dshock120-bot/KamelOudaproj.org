<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>قائمة المشاريع</title>

<style>
body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #d9e8fa;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

h2 {
    color: #287A38;
    margin: 0;
}

button {
    background: #287A38;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 15px;
    cursor: pointer;
}

.search-box {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: 1px solid #aaa;
    border-radius: 10px;
    font-size: 17px;
    margin-bottom: 12px;
    outline: none;
}

.filters {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

select {
    flex: 1;
    min-width: 0;
    padding: 12px 7px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
    font-size: 14px;
}

.project {
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: 0 2px 5px #00000015;
}

.project img {
    width: 100%;
    max-height: 180px;
    object-fit: contain;
    border-radius: 8px;
}

.project h3 {
    color: #287A38;
    margin-bottom: 8px;
}

.project p {
    margin: 6px 0;
}

.empty {
    text-align: center;
    color: #555;
    margin-top: 25px;
}
</style>
</head>

<body>

<header>
    <h2>قائمة المشاريع</h2>
    <button id="addButton" type="button">
        تسجيل الدخول للإضافة
    </button>
</header>

<input
    type="search"
    id="search"
    class="search-box"
    placeholder="ابحث عن مشروع أو اسم المنشئ..."
>

<div class="filters">

    <select id="category">
        <option value="">كل المواد</option>
        <option value="لغة عربية">لغة عربية</option>
        <option value="رياضيات">رياضيات</option>
        <option value="علوم">علوم</option>
        <option value="إنجليزي">إنجليزي</option>
        <option value="قرآن كريم">قرآن كريم</option>
        <option value="دراسات اجتماعية">دراسات اجتماعية</option>
        <option value="تربية فنية">تربية فنية</option>
    </select>

    <select id="grade">
        <option value="">كل الصفوف</option>
        <option value="الصف الأول الابتدائي">الأول الابتدائي</option>
        <option value="الصف الثاني الابتدائي">الثاني الابتدائي</option>
        <option value="الصف الثالث الابتدائي">الثالث الابتدائي</option>
        <option value="الصف الرابع الابتدائي">الرابع الابتدائي</option>
        <option value="الصف الخامس الابتدائي">الخامس الابتدائي</option>
        <option value="الصف السادس الابتدائي">السادس الابتدائي</option>
        <option value="الصف الأول الإعدادي">الأول الإعدادي</option>
        <option value="الصف الثاني الإعدادي">الثاني الإعدادي</option>
        <option value="الصف الثالث الإعدادي">الثالث الإعدادي</option>
        <option value="الصف الأول الثانوي">الأول الثانوي</option>
        <option value="الصف الثاني الثانوي">الثاني الثانوي</option>
        <option value="الصف الثالث الثانوي">الثالث الثانوي</option>
    </select>

</div>

<div id="projects">
    <p class="empty">جاري تحميل المشاريع...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script>
<script src="auth.js?v=20261118-4"></script>

<script>
(async function() {

    const ENDPOINT = "https://fra.cloud.appwrite.io/v1";
    const PROJECT_ID = "6afdd0d200116344a36e";
    const DATABASE_ID = "6afdd419002061d1ceef";
    const TABLE_ID = "6afdd4610022a0ea1d6f";

    const client = new Appwrite.Client();

    client
        .setEndpoint(ENDPOINT)
        .setProject(PROJECT_ID);

    const tablesDB = new Appwrite.TablesDB(client);

    let projects = [];

    const container = document.getElementById("projects");

    // تحميل المشاريع من Appwrite
    async function loadProjects() {

        container.innerHTML =
            '<p class="empty">جاري تحميل المشاريع...</p>';

        try {

            const response = await tablesDB.listRows({
                databaseId: DATABASE_ID,
                tableId: TABLE_ID,
                queries: [
                    Appwrite.Query.limit(100)
                ]
            });

            projects = response.rows || [];

            showProjects();

        } catch (error) {

            console.error("Appwrite Error:", error);

            container.innerHTML = "";

            const message = document.createElement("p");
            message.className = "empty";
            message.textContent =
                "تعذر تحميل المشاريع. تأكد من صلاحيات القراءة وإعدادات Appwrite.";

            container.appendChild(message);
        }
    }

    // عرض المشاريع
    function showProjects() {

        const search = document
            .getElementById("search")
            .value.trim()
            .toLowerCase();

        const category = document.getElementById("category").value;
        const grade = document.getElementById("grade").value;

        container.innerHTML = "";

        const filtered = projects.filter(project => {

            const name = String(project.projectName || "").toLowerCase();
            const creator = String(project.creatorName || "").toLowerCase();

            return (
                (name.includes(search) || creator.includes(search)) &&
                (!category || project.subject === category) &&
                (!grade || project.grade === grade)
            );
        });

        if (filtered.length === 0) {

            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "لا توجد مشاريع مطابقة.";

            container.appendChild(empty);
            return;
        }

        filtered.forEach(project => {

            const card = document.createElement("div");
            card.className = "project";

            if (project.imageUrl) {

                const image = document.createElement("img");

                image.src = project.imageUrl;
                image.alt = "صورة المشروع";

                card.appendChild(image);
            }

            const title = document.createElement("h3");
            title.textContent = project.projectName || "بدون اسم";

            card.appendChild(title);

            const creator = document.createElement("p");
            creator.textContent =
                "المنشئ: " + (project.creatorName || "غير محدد");

            card.appendChild(creator);

            const subject = document.createElement("p");
            subject.textContent =
                "المادة: " + (project.subject || "غير محددة");

            card.appendChild(subject);

            const gradeText = document.createElement("p");
            gradeText.textContent =
                "الصف: " + (project.grade || "غير محدد");

            card.appendChild(gradeText);

            card.addEventListener("click", function() {

                location.href =
                    "project.html?id=" + encodeURIComponent(project.$id);

            });

            container.appendChild(card);
        });
    }

    // البحث والفلاتر
    document.getElementById("search")
        .addEventListener("input", showProjects);

    document.getElementById("category")
        .addEventListener("change", showProjects);

    document.getElementById("grade")
        .addEventListener("change", showProjects);

    // بدء التحميل
    await loadProjects();

})();
</script>

</body>
    </html>
