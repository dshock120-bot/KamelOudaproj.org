<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء مشروع جديد</title><style>
body {
  background-color: #d9e8fa;
  font-family: Arial;
  text-align: center;
}

.container {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 35px auto;
  padding: 20px;
  border-radius: 12px;
  box-sizing: border-box;
}

input, select {
  width: 100%;
  height: 42px;
  margin: 10px 0;
  padding: 8px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}

button {
  background: #287A38;
  color: white;
  width: 120px;
  height: 42px;
  border: none;
  border-radius: 6px;
  margin: 5px;
}

h2 {
  color: #287A38;
}

label {
  display: block;
  text-align: right;
  margin-top: 12px;
}
</style></head><body><div class="container"><h2>إنشاء مشروع جديد</h2><label>اسم المشروع</label>
<input id="projectName" placeholder="اسم المشروع">

<label>اسم المنشئ</label>
<input id="creatorName" placeholder="اسم المنشئ">

<label>الفئة الرئيسية (المادة)</label>

<select id="category">
<option value="">اختر المادة</option>
<option>لغة عربية</option>
<option>رياضيات</option>
<option>علوم</option>
<option>إنجليزي</option>
<option>قرآن كريم</option>
<option>دراسات اجتماعية</option>
<option>تربية فنية</option>
</select><label>الفئة الفرعية (الصف الدراسي)</label>

<select id="grade">
<option value="">اختر الصف الدراسي</option><optgroup label="المرحلة الابتدائية">
<option>الصف الأول الابتدائي</option>
<option>الصف الثاني الابتدائي</option>
<option>الصف الثالث الابتدائي</option>
<option>الصف الرابع الابتدائي</option>
<option>الصف الخامس الابتدائي</option>
<option>الصف السادس الابتدائي</option>
</optgroup><optgroup label="المرحلة الإعدادية">
<option>الصف الأول الإعدادي</option>
<option>الصف الثاني الإعدادي</option>
<option>الصف الثالث الإعدادي</option>
</optgroup><optgroup label="المرحلة الثانوية">
<option>الصف الأول الثانوي</option>
<option>الصف الثاني الثانوي</option>
<option>الصف الثالث الثانوي</option>
</optgroup></select><label>تاريخ العمل</label>
<input type="date" id="workDate">

<label>صورة المشروع</label>
<input type="file" id="projectImage" accept="image/*">

<br><br>

<button onclick="saveProject()">إنشاء المشروع</button>

<button onclick="location.href='list.html'">رجوع</button>

</div><script src="auth.js"></script><script>

// التأكد من تسجيل الدخول
if (!isLoggedIn()) {
    alert("يجب تسجيل الدخول أولاً");
    location.href = "login.html";
}

// إنشاء المشروع
function saveProject() {

    // فحص الصلاحية مرة أخرى
    if (!isLoggedIn()) {
        alert("غير مسموح لك بإضافة المشاريع");
        location.href = "login.html";
        return;
    }

    let name = document.getElementById("projectName").value.trim();
    let creator = document.getElementById("creatorName").value.trim();
    let category = document.getElementById("category").value;
    let grade = document.getElementById("grade").value;
    let date = document.getElementById("workDate").value;
    let image = document.getElementById("projectImage").files[0];

    if (!name || !creator || !category || !grade || !date || !image) {
        alert("من فضلك أكمل جميع البيانات");
        return;
    }

    let reader = new FileReader();

    reader.onload = function() {

        let projects = JSON.parse(localStorage.getItem("projects")) || [];

        let project = {
            id: Date.now().toString(),
            name: name,
            creator: creator,
            category: category,
            grade: grade,
            date: date,
            image: reader.result
        };

        projects.push(project);

        try {

            localStorage.setItem("projects", JSON.stringify(projects));

            alert("تم إنشاء المشروع بنجاح!");

            location.href = "list.html";

        } catch(error) {

            alert("مساحة التخزين غير كافية. جرب صورة أصغر.");

        }

    };

    reader.onerror = function() {
        alert("حدث خطأ أثناء قراءة الصورة");
    };

    reader.readAsDataURL(image);
}

</script></body>
</html>
