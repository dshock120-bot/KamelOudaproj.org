<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>إنشاء مشروع جديد</title>

<style>
body {
    background-color: #d9e8fa;
    font-family: Arial;
    text-align: center;
    margin: 0;
    padding: 15px;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    margin: 35px auto;
    padding: 20px;
    border-radius: 12px;
    box-sizing: border-box;
}

input, select {
    width: 100%;
    height: 42px;
    margin: 10px 0;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    background: #287A38;
    color: white;
    min-width: 120px;
    height: 42px;
    border: none;
    border-radius: 6px;
    margin: 5px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

h2 {
    color: #287A38;
}

label {
    display: block;
    text-align: right;
    margin-top: 12px;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script>
</head>

<body>

<div class="container">

<h2>إنشاء مشروع جديد</h2>

<label>اسم المشروع</label>
<input id="projectName" type="text" placeholder="اسم المشروع">

<label>اسم المنشئ</label>
<input id="creatorName" type="text" placeholder="اسم المنشئ">

<label>المادة</label>
<select id="category">
    <option value="">اختر المادة</option>
    <option value="لغة عربية">لغة عربية</option>
    <option value="رياضيات">رياضيات</option>
    <option value="علوم">علوم</option>
    <option value="إنجليزي">إنجليزي</option>
    <option value="قرآن كريم">قرآن كريم</option>
    <option value="دراسات اجتماعية">دراسات اجتماعية</option>
    <option value="تربية فنية">تربية فنية</option>
</select>

<label>الصف الدراسي</label>
<select id="grade">
    <option value="">اختر الصف الدراسي</option>

    <optgroup label="المرحلة الابتدائية">
        <option value="الصف الأول الابتدائي">الأول الابتدائي</option>
        <option value="الصف الثاني الابتدائي">الثاني الابتدائي</option>
        <option value="الصف الثالث الابتدائي">الثالث الابتدائي</option>
        <option value="الصف الرابع الابتدائي">الرابع الابتدائي</option>
        <option value="الصف الخامس الابتدائي">الخامس الابتدائي</option>
        <option value="الصف السادس الابتدائي">السادس الابتدائي</option>
    </optgroup>

    <optgroup label="المرحلة الإعدادية">
        <option value="الصف الأول الإعدادي">الأول الإعدادي</option>
        <option value="الصف الثاني الإعدادي">الثاني الإعدادي</option>
        <option value="الصف الثالث الإعدادي">الثالث الإعدادي</option>
    </optgroup>

    <optgroup label="المرحلة الثانوية">
        <option value="الصف الأول الثانوي">الأول الثانوي</option>
        <option value="الصف الثاني الثانوي">الثاني الثانوي</option>
        <option value="الصف الثالث الثانوي">الثالث الثانوي</option>
    </optgroup>
</select>

<label>تاريخ المشروع</label>
<input type="date" id="workDate">

<label>صورة المشروع</label>
<input type="file" id="projectImage" accept="image/jpeg,image/png">

<br><br>

<button id="createButton" type="button" onclick="saveProject()">
    إنشاء المشروع
</button>

<button type="button" onclick="location.href='list.html'">
    رجوع
</button>

<p id="message"></p>

</div>

<script src="auth.js?v=20261118-5"></script>

<script>

// إعداد Appwrite
const client = new Appwrite.Client();

client
.setEndpoint("https://fra.cloud.appwrite.io/v1")
.setProject("6afdd0d200116344a36e");

const tablesDB = new Appwrite.TablesDB(client);
const storage = new Appwrite.Storage(client);

// بيانات قاعدة البيانات
const DATABASE_ID = "6afdd419002061d1ceef";
const TABLE_ID = "6afdd4610022a0ea1d6f";
const BUCKET_ID = "6afdd6eb002b777e7c31";

// رسالة الحالة
function showMessage(message, success = false) {
    const element = document.getElementById("message");
    element.textContent = message;
    element.style.color = success ? "green" : "red";
}

// إنشاء المشروع
async function saveProject() {

    const button = document.getElementById("createButton");

    let uploadedFile = null;

    try {

        // التحقق من تسجيل الدخول
        if (typeof isLoggedIn !== "function") {
            throw new Error("لم يتم تحميل ملف auth.js بشكل صحيح");
        }

        const loggedIn = await isLoggedIn();

        if (!loggedIn) {
            alert("يجب تسجيل الدخول أولاً");
            location.href = "login.html";
            return;
        }

        // قراءة البيانات
        const name = document.getElementById("projectName").value.trim();
        const creator = document.getElementById("creatorName").value.trim();
        const category = document.getElementById("category").value;
        const grade = document.getElementById("grade").value;
        const date = document.getElementById("workDate").value;
        const image = document.getElementById("projectImage").files[0];

        // التحقق من البيانات
        if (!name || !creator || !category || !grade || !date || !image) {
            showMessage("من فضلك أكمل جميع البيانات واختر صورة.");
            return;
        }

        if (!["image/jpeg", "image/png"].includes(image.type)) {
            showMessage("الصورة يجب أن تكون JPG أو PNG.");
            return;
        }

        if (image.size > 10 * 1024 * 1024) {
            showMessage("حجم الصورة أكبر من 10 ميجابايت.");
            return;
        }

        button.disabled = true;
        button.textContent = "جارٍ إنشاء المشروع...";
        showMessage("جارٍ رفع الصورة وحفظ المشروع...", true);

        // رفع الصورة
        uploadedFile = await storage.createFile({
            bucketId: BUCKET_ID,
            fileId: Appwrite.ID.unique(),
            file: image
        });

        // رابط الصورة
        const imageUrl = String(storage.getFileView({
            bucketId: BUCKET_ID,
            fileId: uploadedFile.$id
        }));

        // تحويل التاريخ
        const projectDate = new Date(date + "T00:00:00").toISOString();

        // حفظ بيانات المشروع
        await tablesDB.createRow({
            databaseId: DATABASE_ID,
            tableId: TABLE_ID,
            rowId: Appwrite.ID.unique(),

            data: {
                projectName: name,
                creatorName: creator,
                subject: category,
                grade: grade,
                projectDate: projectDate,
                imageUrl: imageUrl
            }
        });

        showMessage("تم إنشاء المشروع بنجاح!", true);

        button.textContent = "تم الإنشاء";

        alert("تم إنشاء المشروع بنجاح!");

        location.href = "list.html";

    } catch (error) {

        console.error("Appwrite Error:", error);

        // حذف الصورة إذا فشل حفظ المشروع
        if (uploadedFile) {
            try {
                await storage.deleteFile({
                    bucketId: BUCKET_ID,
                    fileId: uploadedFile.$id
                });
            } catch (deleteError) {
                console.error("Image deletion error:", deleteError);
            }
        }

        showMessage(
            "فشل إنشاء المشروع: " +
            (error.message || "خطأ غير معروف")
        );

        button.disabled = false;
        button.textContent = "إنشاء المشروع";
    }
}

</script>

</body>
</html>
