<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول</title><style>
body {
    background: #d9e8fa;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
    margin: 0;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 85%;
    max-width: 350px;
    text-align: center;
}

h2 {
    color: #287A38;
}

input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 15px 0;
    border: 1px solid #aaa;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: black;
}

#loginButton {
    display: block;
    width: 100%;
    padding: 13px;
    background-color: #287A38;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

#loginButton:disabled {
    opacity: 0.6;
}

#error {
    color: red;
    font-size: 14px;
}
</style></head><body><div class="box"><h2>تسجيل الدخول</h2>

<p>أدخل بيانات حساب الأدمن للمتابعة</p>

<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
    >

    <button type="submit" id="loginButton">دخول</button>

</form>

<p id="error"></p>

</div><script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script><script>
const client = new Appwrite.Client();

client
    .setEndpoint("https://fra.cloud.appwrite.io/v1")
    .setProject("6afdd0d200116344a36e");

const account = new Appwrite.Account(client);

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const error = document.getElementById("error");
    const button = document.getElementById("loginButton");

    error.textContent = "";

    if (email !== "teacher@gmail.com") {
        error.textContent = "هذا البريد الإلكتروني غير مسموح له بالدخول.";
        return;
    }

    button.disabled = true;
    button.textContent = "جارٍ تسجيل الدخول...";

    try {
        await account.createEmailPasswordSession({
            email: email,
            password: password
        });

        location.href = "add.html";

    } catch (err) {
        console.error(err);

        error.textContent = "خطأ: " + err.message;
        button.disabled = false;
        button.textContent = "دخول";
    }

});
</script></body>
</html>
