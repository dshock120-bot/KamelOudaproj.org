<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">  <title>تفاصيل المشروع</title>  <style>
    body {
      background-color: #d9e8fa;
      font-family: Arial;
      text-align: center;
    }

    .container {
      background-color: white;
      width: 90%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .projectImage {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 10px;
    }

    h2 {
      color: #287A38;
    }

    .details {
      text-align: right;
      line-height: 2;
      font-size: 17px;
    }

    button {
      background-color: #287A38;
      color: white;
      width: 110px;
      height: 40px;
      border: none;
      border-radius: 6px;
    }
  </style></head><body>  <div class="container">
    <h2>تفاصيل المشروع</h2><div id="projectDetails"></div>

<br>

<button onclick="location.href='list.html'">
  رجوع
</button>

  </div>  <script>

    let projects = JSON.parse(localStorage.getItem("projects")) || [];

    let params = new URLSearchParams(location.search);
    let id = params.get("id");

    let project = projects.find(function(item) {
      return item.id === id;
    });

    let container = document.getElementById("projectDetails");

    if (project) {

      let img = document.createElement("img");
      img.className = "projectImage";
      img.src = project.image;
      img.alt = project.name;

      let title = document.createElement("h2");
      title.textContent = project.name;

      let creator = document.createElement("p");
      creator.textContent = "اسم المنشئ: " + project.creator;

      let category = document.createElement("p");
      category.textContent = "الفئة: " + project.category;

      let date = document.createElement("p");
      date.textContent = "تاريخ العمل: " + (project.date || "غير محدد");

      let details = document.createElement("div");
      details.className = "details";

      details.appendChild(creator);
      details.appendChild(category);
      details.appendChild(date);

      container.appendChild(img);
      container.appendChild(title);
      container.appendChild(details);

    } else {

      container.textContent = "المشروع غير موجود.";

    }

  </script></body>
</html>
